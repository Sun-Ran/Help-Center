<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="清单，让每一天更有条理。"><title>清单 · 把今天理清楚</title><style>
:root{--green:#346b50;--ink:#233b30;--muted:#879087;--line:#e7ebe5}*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9ec4a6;outline-offset:3px}aside{width:235px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--line);padding:36px 24px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;font-size:25px;font-weight:750}.logo{background:var(--green);color:white;border-radius:12px;padding:4px 10px}.brand small{font-size:11px;font-weight:400;display:block;letter-spacing:2px;color:var(--muted);margin-top:5px}.navlabel{font-size:11px;letter-spacing:2px;color:#a0a69d;margin:48px 14px 16px}.nav{border:0;background:transparent;text-align:left;width:100%;padding:13px 15px;border-radius:9px;color:#738075;margin-bottom:8px;display:flex;gap:12px;align-items:center}.nav.active{background:#eaf1e7;color:var(--green);font-weight:600}.nav span:last-child{margin-left:auto;font-size:12px}.aside-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:12px;line-height:1.9}main{margin-left:235px;max-width:1330px;padding:47px 7%}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;align-items:center}.avatar{width:34px;height:34px;background:#e6ecd9;border:3px solid white;border-radius:50%;display:grid;place-items:center;color:var(--green)}header{margin:38px 0 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:34px;letter-spacing:-1px;margin:0 0 12px}header p{margin:0;color:var(--muted);font-size:14px}.sun{font-size:46px;color:#d5b46f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:22px 24px}.stat small{color:#899086;font-size:12px}.stat strong{font-size:29px;display:block;margin-top:12px;font-weight:600}.stat strong span{font-size:12px;font-weight:400;color:var(--muted);margin-left:9px}.stat:last-child{background:#eaf0e3}.progress{height:4px;background:#d7e1d0;margin-top:13px;border-radius:5px;overflow:hidden}.progress i{display:block;background:#668763;height:100%;transition:width .3s}.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-top{padding:24px 27px 0;display:flex;justify-content:space-between;align-items:center}.panel-top h2{margin:0;font-size:18px}.search{width:185px;border:0;background:#f7f8f4;border-radius:7px;padding:10px 12px;font-size:12px}.add{margin:22px 27px;display:flex;gap:9px;flex-wrap:wrap;background:#f8faf6;border:1px solid #e2e9dc;border-radius:9px;padding:9px}.add input{flex:1;min-width:150px;border:0;background:transparent;padding:7px;outline:none}.add select{border:0;background:transparent;color:#7c857b;font-size:12px}.primary{border:0;background:var(--green);color:white;padding:10px 18px;border-radius:7px}.filters{display:flex;gap:22px;margin:0 27px;border-bottom:1px solid var(--line)}.filter{background:none;border:0;border-bottom:2px solid transparent;padding:0 0 14px;color:#92988f;font-size:13px}.filter.active{color:var(--green);border-color:var(--green);font-weight:600}.task{display:flex;gap:15px;align-items:center;min-height:81px;padding:17px 28px;border-bottom:1px solid #f0f2ec}.check{appearance:none;flex-shrink:0;width:21px;height:21px;border:1.5px solid #cbd5c7;border-radius:6px;cursor:pointer;margin:0}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';display:block;text-align:center;color:white;font-size:15px}.task-text{flex:1;overflow-wrap:anywhere;min-width:0;line-height:1.5}.task.done .task-text{color:#a9afa5;text-decoration:line-through}.tag{font-size:11px;border-radius:5px;padding:4px 8px;white-space:nowrap}.high{color:#b87966;background:#faf0eb}.normal{color:#9c946b;background:#f6f4e8}.low{color:#78907c;background:#edf3ec}.delete{color:#a3aca0;border:0;background:none;font-size:18px;padding:6px}.panel-foot{display:flex;justify-content:space-between;align-items:center;padding:18px 27px;font-size:12px;color:#939c90}.clear{border:0;background:none;color:#8a9585;font-size:12px}.empty{text-align:center;color:var(--muted);padding:55px 20px;line-height:2}.quote{text-align:center;color:#9ca494;font-size:12px;letter-spacing:1px;margin:31px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#284c39;color:white;padding:12px 22px;border-radius:10px;display:none;font-size:13px}footer{text-align:center;font-size:11px;color:#abb2a4;letter-spacing:1px} @media(min-width:1500px){main{margin-right:auto;margin-left:calc(235px + (100vw - 1500px)/2)}}@media(max-width:800px){aside{width:76px;padding:28px 13px}.brand{justify-content:center}.brand-name,.navlabel,.nav .navtext,.nav span:last-child,.aside-bottom{display:none}.nav{padding:13px;justify-content:center;margin-top:16px}.logo{font-size:20px}main{margin-left:76px;padding:27px 22px}h1{font-size:28px}.stats{gap:8px}.stat{padding:18px 13px}.stat strong{font-size:24px}.stat strong span{display:none}}@media(max-width:500px){main{padding:22px 14px}header{margin-top:28px}.sun{display:none}.panel-top{padding:20px 17px 0;gap:12px}.search{width:115px}.add{margin:19px 15px}.primary{padding:9px 12px}.filters{margin:0 17px;gap:17px}.task{padding:17px 16px;gap:10px}.panel-foot{padding:16px}.tag{font-size:10px}.topline{font-size:11px}.stat small{font-size:11px}.stat strong{font-size:22px}.stats{margin-bottom:22px}header p{font-size:12px}}
</style></head><body><aside><div class="brand"><span class="logo">✓</span><div class="brand-name">清单<small>A LITTLE EVERY DAY</small></div></div><div class="navlabel">我的空间</div><nav><button class="nav active" data-view="all"><span>▤</span><span class="navtext">全部任务</span><span id="navAll">0</span></button><button class="nav" data-view="active"><span>◷</span><span class="navtext">待完成</span><span id="navActive">0</span></button><button class="nav" data-view="done"><span>☑</span><span class="navtext">已完成</span><span id="navDone">0</span></button></nav><div class="aside-bottom">一件一件，慢慢来。<br>让生活有序，也留有余地。<br><br>● 数据保存在此浏览器</div></aside><main><div class="topline"><span id="date"></span><span class="avatar">清</span></div><header><div><h1>把今天，理清楚。</h1><p>留一点专注给重要的事，每一步都算数。</p></div><span class="sun">☼</span></header><section class="stats" aria-label="任务统计"><div class="stat"><small>待完成任务</small><strong id="activeCount">0</strong></div><div class="stat"><small>已完成任务</small><strong id="doneCount">0</strong></div><div class="stat"><small>完成进度</small><strong id="percent">0%</strong><div class="progress"><i id="bar"></i></div></div></section><section class="panel"><div class="panel-top"><h2 id="listTitle">我的任务</h2><input id="search" class="search" placeholder="⌕  搜索任务" aria-label="搜索任务"></div><form class="add" id="addForm"><input id="newTask" maxlength="200" placeholder="＋ 添加一件想做的事…" aria-label="新任务" required autocomplete="off"><select id="priority" aria-label="优先级"><option value="normal">普通优先级</option><option value="high">高优先级</option><option value="low">低优先级</option></select><button class="primary" type="submit">添加任务</button></form><div class="filters"><button class="filter active" data-view="all">全部</button><button class="filter" data-view="active">待完成</button><button class="filter" data-view="done">已完成</button></div><div id="tasks"></div><div class="panel-foot"><span id="remaining" aria-live="polite"></span><button class="clear" id="clearDone">清除已完成</button></div></section><p class="quote">“ 不必一次完成所有事，只需开始下一件。 ”</p><footer>清单 · 给每一天，一点秩序</footer></main><div class="toast" id="toast" role="status"></div><script src="app.js"></script></body></html>
